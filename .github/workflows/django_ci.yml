
name: Django CI/CD (GHCR & Docker)

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

env:
  REGISTRY: ghcr.io

concurrency:
  group: cicd-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # =====================================================
  # 1. TESTS DJANGO
  # =====================================================
  test-django:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    env:
      DB_NAME: django_test_db
      DB_USER: postgres
      DB_PASSWORD: postgres
      DB_HOST: localhost
      DB_PORT: 5432
      DJANGO_SECRET_KEY: cle-de-test-uniquement-pas-un-secret

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: django_test_db
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d django_test_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Vérifier les migrations
        run: |
          python manage.py makemigrations cartographie --check --dry-run

      - name: Exécuter les tests Django
        run: |
          python manage.py test

  # =====================================================
  # 2. BUILD ET PUBLICATION GHCR
  # =====================================================
  build-and-push:
    needs: test-django
    if: github.event_name == 'push'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.nom.outputs.image }}

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v4

      - name: Générer le nom de l'image
        id: nom
        run: |
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Connexion à GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Configurer Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construire et publier l'image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.nom.outputs.image }}:latest
            ${{ steps.nom.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # =====================================================
  # 3. DEPLOIEMENT VPS
  # =====================================================
  deploy:
    needs: build-and-push

    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    runs-on: ubuntu-latest

    environment: production

    steps:
      - name: Déployer sur le VPS via SSH
        uses: appleboy/ssh-action@v1.2.0

        env:
          GHCR_USER: ${{ secrets.GHCR_USER }}
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}

        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 10m

          envs: GHCR_USER,GHCR_READ_TOKEN

          script: |
            set -Eeuo pipefail

            echo "======================================"
            echo "DEBUT DU DEPLOIEMENT MEAL AFRIQUE"
            echo "======================================"

            cd /home/Cartographie-Meal

            # 1. Mise à jour du dépôt
            echo "1. Mise à jour Git..."
            git pull origin main

            # 2. Vérification des identifiants
            echo "2. Vérification des identifiants GHCR..."

            if [ -z "${GHCR_USER:-}" ]; then
              echo "ERREUR : GHCR_USER est vide"
              exit 1
            fi

            if [ -z "${GHCR_READ_TOKEN:-}" ]; then
              echo "ERREUR : GHCR_READ_TOKEN est vide"
              exit 1
            fi

            echo "Identifiants GHCR disponibles."

            # 3. Authentification GHCR
            echo "3. Connexion à GHCR..."

            printf '%s' "$GHCR_READ_TOKEN" | docker login ghcr.io \
              --username "$GHCR_USER" \
              --password-stdin

            # 4. Récupération de l'image
            echo "4. Téléchargement de la nouvelle image..."
            docker compose pull

            # 5. Migrations Django
            echo "5. Application des migrations..."
            docker compose run --rm web \
              python manage.py migrate --noinput

            # 6. Démarrage des services
            echo "6. Démarrage des conteneurs..."
            docker compose up -d --remove-orphans

            # 7. Fichiers statiques
            echo "7. Collecte des fichiers statiques..."
            docker compose exec -T web \
              python manage.py collectstatic --noinput

            # 8. Vérification des conteneurs
            echo "8. Vérification des services..."
            docker compose ps

            # 9. Nettoyage
            echo "9. Nettoyage des anciennes images..."
            docker image prune -f

            # 10. Déconnexion GHCR
            docker logout ghcr.io

            echo "======================================"
            echo "DEPLOIEMENT TERMINE AVEC SUCCES"
            echo "======================================"
